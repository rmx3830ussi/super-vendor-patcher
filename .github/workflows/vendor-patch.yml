name: Vendor Patch

on:
  workflow_dispatch:
    inputs:
      SOURCE:
        description: 'Where to get super.img from'
        required: true
        type: choice
        options:
          - direct_url
          - mediafire_pac
        default: 'mediafire_pac'
      SUPER_IMG_URL:
        description: 'Only used when SOURCE=direct_url'
        required: false
      MEDIAFIRE_URL_1:
        description: 'Only used when SOURCE=mediafire_pac. Part 1 URL.'
        required: false
        default: 'https://www.mediafire.com/file/fxqbbulzea7q1fu/RMX3830export_15_F.98_2026011910520000_GsmMafia.Com.7z.001/file'
      MEDIAFIRE_URL_2:
        description: 'Only used when SOURCE=mediafire_pac. Part 2 URL.'
        required: false
        default: 'https://www.mediafire.com/file/msvz15gtbkiunok/RMX3830export_15_F.98_2026011910520000_GsmMafia.Com.7z.002/file'
      MEDIAFIRE_URL_3:
        description: 'Only used when SOURCE=mediafire_pac. Part 3 URL.'
        required: false
        default: 'https://www.mediafire.com/file/1ef3s7qjo3b2z3c/RMX3830export_15_F.98_2026011910520000_GsmMafia.Com.7z.003/file'
      MODE:
        description: 'extract = pull fstab files out for editing | patch = apply patches/ and repack'
        required: true
        type: choice
        options:
          - extract
          - patch
      VENDOR_PARTITION_NAME:
        description: 'Name of the vendor partition inside super (e.g. vendor_a)'
        required: true
        default: 'vendor_a'

env:
  WORK: /mnt/tmp/work

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Slim the runner (free disk space)
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install base tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs erofs-utils util-linux wget unzip xz-utils python3 aria2 p7zip-full libc++1

      - name: Get prebuilt lpunpack/lpmake/simg2img/ext2simg
        run: |
          git clone --depth=1 https://github.com/Rprop/aosp15_partition_tools.git tools_repo
          sudo cp tools_repo/linux_glibc_x86_64/* /usr/bin/
          sudo chmod +x /usr/bin/append2simg /usr/bin/ext2simg /usr/bin/img2simg \
                         /usr/bin/lpadd /usr/bin/lpdumps /usr/bin/lpmake \
                         /usr/bin/lpunpack /usr/bin/simg2img

      - name: Fix libc++ dependency for prebuilt tools
        run: |
          LIBCXX=$(find / -name "libc++.so.1" 2>/dev/null | head -n1)
          if [ -z "$LIBCXX" ]; then
            echo "libc++.so.1 not found after installing libc++1 - aborting" >&2
            exit 1
          fi
          sudo ln -sf "$LIBCXX" /usr/lib/x86_64-linux-gnu/libc++.so
          sudo ldconfig
          simg2img 2>&1 | head -n1 || true

      - name: Get avbtool
        run: |
          wget -q https://raw.githubusercontent.com/jbeich/platform_external_avb/master/avbtool.py -O /tmp/avbtool.py
          sudo mv /tmp/avbtool.py /usr/local/bin/avbtool.py
          sudo chmod +x /usr/local/bin/avbtool.py

      - name: Prepare /mnt/tmp/work working directory
        run: |
          sudo mkdir -p "$WORK"
          sudo chown -R "$(whoami)":"$(whoami)" /mnt/tmp

      # ---------------- Get super.img: direct URL ----------------
      - name: "[direct_url] Download super.img"
        if: ${{ github.event.inputs.SOURCE == 'direct_url' }}
        run: |
          cd "$WORK"
          wget -q "${{ github.event.inputs.SUPER_IMG_URL }}" -O super_download
          if file super_download | grep -qi gzip; then
            mv super_download super.img.gz && gunzip super.img.gz
          elif file super_download | grep -qi xz; then
            mv super_download super.img.xz && unxz super.img.xz
          else
            mv super_download super.img
          fi

      # ---------------- Get super.img: mediafire .pac firmware ----------------
      - name: "[mediafire_pac] Download + extract firmware, get super.img"
        if: ${{ github.event.inputs.SOURCE == 'mediafire_pac' }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/fetch_mediafire_firmware.sh" /mnt/tmp \
            "${{ github.event.inputs.MEDIAFIRE_URL_1 }}" \
            "${{ github.event.inputs.MEDIAFIRE_URL_2 }}" \
            "${{ github.event.inputs.MEDIAFIRE_URL_3 }}"
          mv "$HOME/super.img" "$WORK/super.img"

      - name: Convert sparse image if needed
        run: |
          cd "$WORK"
          if simg2img super.img super.raw.img 2>/dev/null; then
            mv super.raw.img super.img
          fi

      - name: Unpack super partition
        run: |
          cd "$WORK"
          mkdir -p unpacked
          lpunpack super.img unpacked/
          ls -la unpacked/

      - name: Copy vendor image
        run: |
          cd "$WORK"
          VNAME="${{ github.event.inputs.VENDOR_PARTITION_NAME }}"
          cp "unpacked/${VNAME}.img" vendor.img

      - name: Detect vendor filesystem type
        run: |
          cd "$WORK"
          if file vendor.img | grep -qi erofs; then
            FSTYPE=erofs
          else
            FSTYPE=ext4
          fi
          echo "Detected vendor filesystem: $FSTYPE"
          echo "VENDOR_FSTYPE=$FSTYPE" >> "$GITHUB_ENV"

      # ---------------- ext4 path ----------------
      - name: "[ext4] Resize and mount"
        if: ${{ env.VENDOR_FSTYPE == 'ext4' }}
        run: |
          cd "$WORK"
          e2fsck -yf vendor.img || true
          sudo resize2fs vendor.img 2G
          mkdir -p vendor
          sudo mount -o loop vendor.img vendor
          find vendor/etc -maxdepth 1 -iname "fstab.*" | sort

      # ---------------- erofs path ----------------
      - name: "[erofs] Extract read-only (mount or fsck.erofs fallback)"
        if: ${{ env.VENDOR_FSTYPE == 'erofs' }}
        run: |
          cd "$WORK"
          sudo modprobe erofs || true
          mkdir -p vendor
          if sudo mount -t erofs -o loop vendor.img vendor 2>/dev/null; then
            echo "Mounted erofs read-only via kernel driver"
          else
            echo "Kernel erofs mount unavailable, extracting via fsck.erofs instead"
            rmdir vendor
            sudo fsck.erofs --extract=vendor vendor.img
          fi
          find vendor/etc -maxdepth 1 -iname "fstab.*" | sort

      # ---------------- MODE: extract ----------------
      - name: "[extract] Zip fstab files found in vendor"
        if: ${{ github.event.inputs.MODE == 'extract' }}
        run: |
          cd "$WORK"
          mkdir -p extracted
          sudo find vendor/etc -maxdepth 1 -iname "fstab.*" -exec cp {} extracted/ \;
          sudo chown -R "$(whoami)":"$(whoami)" extracted
          cd extracted && zip -r ../fstabs.zip . && cd ..
          ls -la extracted > "$GITHUB_WORKSPACE/fstab_manifest.txt"
          cat "$GITHUB_WORKSPACE/fstab_manifest.txt"

      - name: "[extract] Upload fstab zip + manifest"
        if: ${{ github.event.inputs.MODE == 'extract' }}
        uses: actions/upload-artifact@v4
        with:
          name: fstab-extract
          path: |
            /mnt/tmp/work/fstabs.zip
            fstab_manifest.txt

      # ---------------- MODE: patch (ext4 write-back) ----------------
      - name: "[patch][ext4] Apply patches from config/patch_map.json"
        if: ${{ github.event.inputs.MODE == 'patch' && env.VENDOR_FSTYPE == 'ext4' }}
        run: |
          cd "$WORK"
          echo "Vendor Patch Run Log (ext4) - $(date -u)" > "$GITHUB_WORKSPACE/patch_run.log"
          python3 "$GITHUB_WORKSPACE/scripts/apply_patch_map.py" vendor "$GITHUB_WORKSPACE" >> "$GITHUB_WORKSPACE/patch_run.log"
          cat "$GITHUB_WORKSPACE/patch_run.log"

      - name: "[patch][ext4] Unmount and shrink vendor image"
        if: ${{ github.event.inputs.MODE == 'patch' && env.VENDOR_FSTYPE == 'ext4' }}
        run: |
          cd "$WORK"
          sudo umount vendor
          e2fsck -yf vendor.img || true
          sudo resize2fs -M vendor.img
          e2fsck -yf vendor.img || true

      # ---------------- MODE: patch (erofs rebuild) ----------------
      - name: "[patch][erofs] Apply patches to extracted directory"
        if: ${{ github.event.inputs.MODE == 'patch' && env.VENDOR_FSTYPE == 'erofs' }}
        run: |
          cd "$WORK"
          echo "Vendor Patch Run Log (erofs) - $(date -u)" > "$GITHUB_WORKSPACE/patch_run.log"
          # If still kernel-mounted read-only, switch to a real fsck.erofs extraction
          # so files can actually be modified before rebuilding.
          if mountpoint -q vendor; then
            sudo umount vendor
            rm -rf vendor
            sudo fsck.erofs --extract=vendor vendor.img
          fi
          sudo chown -R "$(whoami)":"$(whoami)" vendor
          python3 "$GITHUB_WORKSPACE/scripts/apply_patch_map.py" vendor "$GITHUB_WORKSPACE" >> "$GITHUB_WORKSPACE/patch_run.log"
          cat "$GITHUB_WORKSPACE/patch_run.log"

      - name: "[patch][erofs] Rebuild vendor.img with mkfs.erofs"
        if: ${{ github.event.inputs.MODE == 'patch' && env.VENDOR_FSTYPE == 'erofs' }}
        run: |
          cd "$WORK"
          sudo mkfs.erofs -zlz4hc vendor_new.img vendor/
          echo "" >> "$GITHUB_WORKSPACE/patch_run.log"
          echo "Rebuilt erofs image: vendor_new.img" >> "$GITHUB_WORKSPACE/patch_run.log"
          echo "NOTE: compression settings (-zlz4hc) are a best guess and may not" >> "$GITHUB_WORKSPACE/patch_run.log"
          echo "exactly match the original image's mkfs.erofs parameters." >> "$GITHUB_WORKSPACE/patch_run.log"

      - name: "[patch] Note on AVB / vbmeta"
        if: ${{ github.event.inputs.MODE == 'patch' }}
        run: |
          {
            echo ""
            echo "NOTE: vendor image was modified, which invalidates its original AVB hash."
            echo "This build does NOT re-sign or repack vendor into super, and does NOT"
            echo "produce a flashable image. Review this log first. Flashing a modified"
            echo "vendor without disabling AVB verification (fastboot --disable-verification"
            echo "on vbmeta) WILL cause a bootloop."
          } >> "$GITHUB_WORKSPACE/patch_run.log"
          cat "$GITHUB_WORKSPACE/patch_run.log"

      - name: "[patch] Upload run log only (no vendor/super image)"
        if: ${{ github.event.inputs.MODE == 'patch' }}
        uses: actions/upload-artifact@v4
        with:
          name: patch-run-log
          path: patch_run.log
