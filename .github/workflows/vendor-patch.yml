name: Vendor Patch

on:
  workflow_dispatch:
    inputs:
      SOURCE:
        description: 'Where to get super.img from'
        required: true
        type: choice
        options:
          - direct_url
          - mediafire_pac
        default: 'mediafire_pac'
      SUPER_IMG_URL:
        description: 'Only used when SOURCE=direct_url'
        required: false
      MEDIAFIRE_URL_1:
        description: 'Only used when SOURCE=mediafire_pac. Part 1 URL.'
        required: false
        default: 'https://www.mediafire.com/file/fxqbbulzea7q1fu/RMX3830export_15_F.98_2026011910520000_GsmMafia.Com.7z.001/file'
      MEDIAFIRE_URL_2:
        description: 'Only used when SOURCE=mediafire_pac. Part 2 URL.'
        required: false
        default: 'https://www.mediafire.com/file/msvz15gtbkiunok/RMX3830export_15_F.98_2026011910520000_GsmMafia.Com.7z.002/file'
      MEDIAFIRE_URL_3:
        description: 'Only used when SOURCE=mediafire_pac. Part 3 URL.'
        required: false
        default: 'https://www.mediafire.com/file/1ef3s7qjo3b2z3c/RMX3830export_15_F.98_2026011910520000_GsmMafia.Com.7z.003/file'
      MODE:
        description: 'extract = pull fstab files out for editing | patch = apply patches/ and repack'
        required: true
        type: choice
        options:
          - extract
          - patch
      VENDOR_PARTITION_NAME:
        description: 'Name of the vendor partition inside super (e.g. vendor_a)'
        required: true
        default: 'vendor_a'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Slim the runner (free disk space)
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install base tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs util-linux wget unzip xz-utils python3 aria2 p7zip-full

      - name: Get prebuilt lpunpack/lpmake/simg2img/ext2simg
        run: |
          git clone --depth=1 https://github.com/Rprop/aosp15_partition_tools.git tools_repo
          mkdir -p tools
          cp tools_repo/linux_glibc_x86_64/* tools/
          chmod +x tools/*

      - name: Get avbtool
        run: |
          wget -q https://raw.githubusercontent.com/jbeich/platform_external_avb/master/avbtool.py -O tools/avbtool.py
          chmod +x tools/avbtool.py

      - name: Prepare /mnt/tmp working directory
        run: |
          sudo mkdir -p /mnt/tmp
          sudo chown -R "$(whoami)":"$(whoami)" /mnt/tmp

      # ---------------- Get super.img: direct URL ----------------
      - name: "[direct_url] Download super.img"
        if: ${{ github.event.inputs.SOURCE == 'direct_url' }}
        run: |
          cd /mnt/tmp
          sudo wget -q "${{ github.event.inputs.SUPER_IMG_URL }}" -O super_download
          if file super_download | grep -qi gzip; then
            sudo mv super_download super.img.gz && sudo gunzip super.img.gz
          elif file super_download | grep -qi xz; then
            sudo mv super_download super.img.xz && sudo unxz super.img.xz
          else
            sudo mv super_download super.img
          fi
          sudo mv super.img "$HOME/super.img"

      # ---------------- Get super.img: mediafire .pac firmware ----------------
      - name: "[mediafire_pac] Download + extract firmware, get super.img"
        if: ${{ github.event.inputs.SOURCE == 'mediafire_pac' }}
        run: |
          bash scripts/fetch_mediafire_firmware.sh /mnt/tmp \
            "${{ github.event.inputs.MEDIAFIRE_URL_1 }}" \
            "${{ github.event.inputs.MEDIAFIRE_URL_2 }}" \
            "${{ github.event.inputs.MEDIAFIRE_URL_3 }}"

      - name: Move super.img into work directory
        run: |
          sudo mkdir -p /mnt/tmp/work
          sudo mv "$HOME/super.img" /mnt/tmp/work/super.img
          sudo chown -R "$(whoami)":"$(whoami)" /mnt/tmp/work

      - name: Convert sparse image if needed
        run: |
          cd /mnt/tmp/work
          if ../../tools/simg2img super.img super.raw.img 2>/dev/null; then
            sudo mv super.raw.img super.img
          fi
        working-directory: /mnt/tmp/work

      - name: Unpack super partition
        run: |
          cd /mnt/tmp/work
          $GITHUB_WORKSPACE/tools/lpunpack super.img unpacked/
          ls -la unpacked/

      - name: Prepare vendor image for mount
        run: |
          cd /mnt/tmp/work
          VNAME="${{ github.event.inputs.VENDOR_PARTITION_NAME }}"
          sudo cp "unpacked/${VNAME}.img" vendor.img
          sudo e2fsck -yf vendor.img || true
          sudo resize2fs vendor.img 2G

      - name: Mount vendor image
        run: |
          cd /mnt/tmp/work
          sudo mkdir -p vendor
          sudo mount -o loop vendor.img vendor
          find vendor/etc -maxdepth 1 -iname "fstab.*" | sort

      # ---------------- MODE: extract ----------------
      - name: "[extract] Zip fstab files found in vendor"
        if: ${{ github.event.inputs.MODE == 'extract' }}
        run: |
          cd /mnt/tmp/work
          sudo mkdir -p extracted
          sudo find vendor/etc -maxdepth 1 -iname "fstab.*" -exec cp {} extracted/ \;
          sudo chown -R "$(whoami)":"$(whoami)" extracted
          cd extracted && zip -r ../fstabs.zip . && cd ..
          ls -la extracted > "$GITHUB_WORKSPACE/fstab_manifest.txt"
          cat "$GITHUB_WORKSPACE/fstab_manifest.txt"

      - name: "[extract] Upload fstab zip + manifest"
        if: ${{ github.event.inputs.MODE == 'extract' }}
        uses: actions/upload-artifact@v4
        with:
          name: fstab-extract
          path: |
            /mnt/tmp/work/fstabs.zip
            fstab_manifest.txt

      # ---------------- MODE: patch ----------------
      - name: "[patch] Apply patches from config/patch_map.json"
        if: ${{ github.event.inputs.MODE == 'patch' }}
        run: |
          cd /mnt/tmp/work
          echo "Vendor Patch Run Log - $(date -u)" > "$GITHUB_WORKSPACE/patch_run.log"
          python3 - << 'PYEOF' >> "$GITHUB_WORKSPACE/patch_run.log"
          import json, os, shutil

          with open(os.environ["GITHUB_WORKSPACE"] + "/config/patch_map.json") as f:
              mapping = json.load(f)

          for entry in mapping:
              src = os.environ["GITHUB_WORKSPACE"] + "/" + entry["source"]
              dst = "vendor/" + entry["target"]
              if not os.path.isfile(src):
                  print(f"SKIP (no patch file): {entry['source']}")
                  continue
              if not os.path.isfile(dst):
                  print(f"SKIP (target not present in vendor): {entry['target']}")
                  continue
              before = open(dst, "rb").read()
              shutil.copyfile(src, dst)
              after = open(dst, "rb").read()
              status = "CHANGED" if before != after else "IDENTICAL (no diff)"
              print(f"PATCHED: {entry['target']}  <-  {entry['source']}  [{status}]")
          PYEOF
          cat "$GITHUB_WORKSPACE/patch_run.log"

      - name: "[patch] Unmount and shrink vendor image"
        if: ${{ github.event.inputs.MODE == 'patch' }}
        run: |
          cd /mnt/tmp/work
          sudo umount vendor
          sudo e2fsck -yf vendor.img || true
          sudo resize2fs -M vendor.img
          sudo e2fsck -yf vendor.img || true

      - name: "[patch] Note on AVB / vbmeta"
        if: ${{ github.event.inputs.MODE == 'patch' }}
        run: |
          {
            echo ""
            echo "NOTE: vendor.img was modified, which invalidates its original AVB hash."
            echo "This build does NOT re-sign or repack vendor into super, and does NOT"
            echo "produce a flashable image. Review this log first. Flashing a modified"
            echo "vendor without disabling AVB verification (fastboot --disable-verification"
            echo "on vbmeta) WILL cause a bootloop."
          } >> "$GITHUB_WORKSPACE/patch_run.log"
          cat "$GITHUB_WORKSPACE/patch_run.log"

      - name: "[patch] Upload run log only (no vendor/super image)"
        if: ${{ github.event.inputs.MODE == 'patch' }}
        uses: actions/upload-artifact@v4
        with:
          name: patch-run-log
          path: patch_run.log
